---
- name: create a user
  hosts: domain_controller
  gather_facts: false
  
  tasks:
    - name: create user in domain
      microsoft.ad.user:
        identity_type: user
        firstname: "{{ user }}"
        lastname: "smith"
        groups: "{{ group_name }}"
        name: "{{ user }}"
        password: "{{ password }}"
        state: present