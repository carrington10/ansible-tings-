- name: add  user to ad group
  hosts: domain_controller
  gather_facts: no 
  vars:
    domain_name: kingdom.local
    group_name: "{{group_name}}"
  
  tasks:
    - name: add user to ad group 
      microsoft.ad.group:
       name: "{group_name}}"
       members: 
         add:
            - "{{ user }}"
      state: present 

    - name: get membership of group 
      microsoft.ad.group:
        name: "{{group_name}}"
        state: present
        register: group_info