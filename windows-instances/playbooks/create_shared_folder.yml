- name: create shared folder
  hosts: "{{ target_host }}"
  gather_facts: no

  tasks:
    - name: create folder share
      ansible.windows.win_file:
       path: "{{ share_path }}"
       state: directory
      register: folder_created

    - name: disable inheritance
      ansible.windows.win_acl_inheritance:
        path: "{{ share_path }}"
        state: absent
      register: inheritance_disabled
      when: folder_created.changed

    - name: set permissions to folder
      ansible.windows.win_acl:
        name: "{{ share_name }}"
        path: "{{ share_path }}"
        user: "{{ item }}"
        rights: "fullcontrol"
        type: allow
        state: present
      loop:
        - kingdom\staff
        - administrators
        - system
      when: folder_created.changed



