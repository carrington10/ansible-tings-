- name: create shared folder
  hosts: "{{ target_host }}"
  gather_facts: no

  tasks:
    - name: create folder share
      ansible.windows.win_file:
       path: "{{ share_path }}"
       state: directory
       register: folder_created

    - name: modify permissions for shared folder
      ansible.windows.win_share:
        name: "{{ share_name }}"
        desciription: "shared folder for staffing department"
        path: "{{ share_path }}"
        list: true
        full: Administrators, kingdom.local\staff
        read: Users
        when: folder_created.changed